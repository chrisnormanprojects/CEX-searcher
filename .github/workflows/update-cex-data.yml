name: Update CeX data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/update-cex-data.yml'
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: write

concurrency:
  group: update-cex-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Verify collection logic
        run: node --test scripts/catalogue-core.test.mjs

      - name: Fetch and validate CeX catalogue
        run: |
          for attempt in 1 2 3; do
            if node scripts/fetch-cex.mjs; then exit 0; fi
            echo "Refresh incomplete; retrying without publishing ($attempt/3)"
            sleep 10
          done
          exit 1

      - name: Commit refreshed data
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Keep the freshly generated catalogue outside Git while we sync to
          # the latest main. This avoids rebasing thousands of generated files
          # if another commit lands while the catalogue is being collected.
          snapshot="$(mktemp -d)"
          cp -a data/. "$snapshot/"

          for attempt in 1 2 3 4 5; do
            echo "Publishing refreshed catalogue ($attempt/5)"
            git fetch origin main
            git reset --hard origin/main
            rm -rf data
            mkdir -p data
            cp -a "$snapshot/." data/
            git add -A data/

            if git diff --cached --quiet; then
              echo "No data changes"
              exit 0
            fi

            git commit -m "Update CeX catalogue"
            if git push origin HEAD:main; then
              echo "Refreshed catalogue published"
              exit 0
            fi

            echo "Main changed during publish; retrying from latest main"
            sleep $((attempt * 2))
          done

          echo "Unable to publish refreshed catalogue after 5 attempts"
          exit 1

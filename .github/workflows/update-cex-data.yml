name: Update CeX data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/update-cex-data.yml'
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: write

concurrency:
  group: update-cex-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Verify collection logic
        run: node --test scripts/catalogue-core.test.mjs

      - name: Fetch and validate CeX catalogue
        run: |
          for attempt in 1 2 3; do
            if node scripts/fetch-cex.mjs; then exit 0; fi
            echo "Refresh incomplete; retrying without publishing ($attempt/3)"
            sleep 10
          done
          exit 1

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "Update CeX catalogue"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push raced with another commit; rebasing and retrying ($attempt/3)"
            git pull --rebase origin main
            sleep $((attempt * 2))
          done
          echo "Unable to publish refreshed catalogue after 3 attempts"
          exit 1
